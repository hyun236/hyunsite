<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>신민찬 아카이브 — 7단 변신 도감 및 탄막 토벌전</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0d;
      --surface: #121216;
      --surface-alt: #18181d;
      --surface-hover: #202027;
      --line: #24242b;
      --line-strong: #34343e;
      --text: #f4f4f6;
      --text-sub: #a1a1aa;
      --text-dim: #686873;
      --accent: #e11d48;
      --accent-soft: rgba(225, 29, 72, 0.14);
      --ivory: #e4e4e7;
      --gold: #eab308;
      --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background-color: #070709;
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    .frame-container {
      max-width: 520px;
      height: 100dvh;
      margin: 0 auto;
      background-color: var(--bg);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 상단 에디토리얼 헤더 */
    .masthead {
      flex-shrink: 0;
      height: 50px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
    }

    .masthead-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .masthead-mark {
      display: inline-block;
      width: 6px;
      height: 14px;
      background: var(--accent);
    }

    .masthead-meta {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 0.04em;
    }

    /* 메인 뷰 전환 영역 */
    .stage {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .panel {
      position: absolute;
      inset: 0;
      padding: 16px;
      overflow-y: auto;
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel::-webkit-scrollbar {
      display: none;
    }

    .panel.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    /* 이미지 슬롯 및 폴백 */
    .photo-box {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--surface-alt);
      overflow: hidden;
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-fallback {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: repeating-linear-gradient(
        -45deg,
        #121216,
        #121216 10px,
        #16161b 10px,
        #16161b 20px
      );
      color: var(--text-dim);
    }

    .photo-box.is-missing img {
      display: none;
    }

    .photo-box.is-missing .photo-fallback {
      display: flex;
    }

    .fb-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .fb-file {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent);
      border: 1px solid var(--line-strong);
      background: var(--bg);
      padding: 2px 8px;
      border-radius: 3px;
    }

    /* ============================
       PANEL 1: PROFILE
       ============================ */
    .cover-card {
      position: relative;
      height: 225px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .cover-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(11,11,13,0.96) 0%, rgba(11,11,13,0.3) 55%, transparent 100%);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .cover-eyebrow {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .cover-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .cover-name {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #fff;
    }

    .cover-phys {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .cover-quote {
      font-size: 12.5px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    /* 매거진 인덱스 스펙 테이블 */
    .spec-table {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      overflow: hidden;
    }

    .spec-row {
      display: grid;
      grid-template-columns: 88px 1fr;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    .spec-row:last-child {
      border-bottom: none;
    }

    .spec-key {
      padding: 10px 12px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      background: var(--surface-alt);
      border-right: 1px solid var(--line);
      display: flex;
      align-items: center;
    }

    .spec-val {
      padding: 10px 12px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      word-break: keep-all;
    }

    /* 호불호 탭 컨트롤 */
    .segment-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      padding: 3px;
    }

    .segment-btn {
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 0;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .segment-btn.is-active {
      background: var(--surface-hover);
      color: var(--text);
    }

    .segment-btn.is-active.hate {
      color: #fb7185;
    }

    .trio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .trio-item {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      overflow: hidden;
    }

    .trio-thumb {
      height: 78px;
      border-bottom: 1px solid var(--line);
    }

    .trio-meta {
      padding: 8px;
    }

    .trio-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 2px;
    }

    .trio-desc {
      font-size: 10.5px;
      color: var(--text-sub);
      line-height: 1.35;
    }

    /* ============================
       PANEL 2: 7-FORMS EXHIBITION
       ============================ */
    .exhibit-card {
      flex: 1;
      min-height: 300px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .exhibit-media {
      flex: 1;
      min-height: 200px;
      position: relative;
      border-bottom: 1px solid var(--line);
    }

    .exhibit-index {
      position: absolute;
      top: 10px;
      left: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      color: var(--text);
      background: rgba(11, 11, 13, 0.85);
      border: 1px solid var(--line-strong);
      padding: 3px 8px;
      border-radius: 3px;
    }

    .exhibit-caption {
      padding: 15px 16px;
    }

    .exhibit-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .exhibit-name {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .exhibit-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 2px 8px;
      border-radius: 3px;
    }

    .exhibit-text {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .gauge-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
    }

    .gauge-bar {
      flex: 1;
      height: 3px;
      background: var(--line-strong);
    }

    .gauge-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.25s ease;
    }

    .index-strip {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .index-btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text-dim);
      border-radius: 4px;
      padding: 8px 2px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.15s;
    }

    .index-btn .idx-no {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
    }

    .index-btn .idx-lbl {
      font-size: 11px;
      font-weight: 700;
    }

    .index-btn.is-active {
      background: var(--surface-hover);
      border-color: var(--accent);
      color: var(--text);
    }

    /* ============================
       PANEL 3: WAIFU & GOAL
       ============================ */
    .split-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex: 1;
      min-height: 245px;
    }

    .portrait-card {
      position: relative;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      overflow: hidden;
      background: var(--surface);
    }

    .portrait-caption {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(11,11,13,0.96) 0%, rgba(11,11,13,0.25) 55%, transparent 100%);
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .portrait-code {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 3px;
    }

    .portrait-title {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 3px;
    }

    .portrait-desc {
      font-size: 11px;
      color: var(--text-sub);
      line-height: 1.38;
    }

    .goal-card {
      position: relative;
      height: 168px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .goal-caption {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(11,11,13,0.95) 0%, rgba(11,11,13,0.6) 65%, rgba(11,11,13,0.2) 100%);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ============================
       PANEL 4: TOUHOU BOSS RAID
       ============================ */
    .danmaku-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
    }

    .boss-status-panel {
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 9px 12px;
      flex-shrink: 0;
    }

    .boss-header-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }

    .boss-name-label {
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .spell-badge {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 1px 7px;
      border-radius: 3px;
    }

    .boss-hp-num {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .hp-bar-outer {
      position: relative;
      width: 100%;
      height: 6px;
      background: #070709;
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .hp-bar-inner {
      height: 100%;
      width: 100%;
      background: var(--accent);
      transition: width 0.08s linear;
    }

    /* 축복 발동 지점 눈금 (70%, 35%) */
    .hp-tick {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1.5px;
      background: #fff;
      opacity: 0.7;
    }

    .player-telemetry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
    }

    .arena-container {
      position: relative;
      flex: 1;
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      overflow: hidden;
      background: #08080a;
      touch-action: none;
    }

    canvas#danmakuCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

      position: absolute;
      bottom: 12px;

      z-index:
